name: CI

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Check formatting
        run: make lint

  test:
    name: Build & Test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Generate project
        env:
          TUIST_CODE_SIGN_IDENTITY: ${{ secrets.TUIST_CODE_SIGN_IDENTITY }}
          TUIST_DEVELOPMENT_TEAM: ${{ secrets.TUIST_DEVELOPMENT_TEAM }}
        run: make generate
      - name: Verify generated sources are committed
        run: git diff --exit-code
      - name: Build & test
        run: |
          make bundled-git
          ./script/test_bundled_git.sh .build/bundled-git/runtime
          WORKSPACE=$(ls -d *.xcworkspace | head -1)
          for SCHEME in AppTests CoreGitCredential CoreRepositoryDiff DataGit \
            FeatureRepositoryChanges FeatureRepositoryHistory FeatureRepositoryOperations \
            FeatureRepositoryStashes FeatureRepositoryTree; do
            xcodebuild test \
              -workspace "$WORKSPACE" \
              -scheme "$SCHEME" \
              -destination 'platform=macOS' \
              CODE_SIGNING_ALLOWED=NO
          done
