name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  release:
    needs: verify
    name: Build Release
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Generate project
        run: make generate
      - name: Verify generated sources are committed
        run: git diff --exit-code
      - name: Package release
        env:
          VERSION: ${{ github.ref_name }}
        run: ./script/package_release.sh "${VERSION#v}" dist "$GITHUB_RUN_NUMBER"
      - name: Verify package
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          cd dist
          shasum -a 256 -c "Pluminon-${VERSION#v}.dmg.sha256"
          hdiutil verify "Pluminon-${VERSION#v}.dmg"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$VERSION" \
            "dist/Pluminon-${VERSION#v}.dmg" \
            "dist/Pluminon-${VERSION#v}.dmg.sha256" \
            --verify-tag \
            --title "Pluminon ${VERSION#v}" \
            --generate-notes
