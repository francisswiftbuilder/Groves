name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build Release
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
      - name: Generate project
        run: make generate
      - name: Verify generated sources are committed
        run: git diff --exit-code
      - name: Package release
        env:
          VERSION: ${{ github.ref_name }}
        run: ./script/package_release.sh "${VERSION#v}" dist "$GITHUB_RUN_NUMBER"
      - name: Verify package
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          cd dist
          shasum -a 256 -c "Groves-${VERSION#v}.dmg.sha256"
          hdiutil verify "Groves-${VERSION#v}.dmg"
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release create "$VERSION" \
            "dist/Groves-${VERSION#v}.dmg" \
            "dist/Groves-${VERSION#v}.dmg.sha256" \
            --verify-tag \
            --title "Groves ${VERSION#v}" \
            --generate-notes
